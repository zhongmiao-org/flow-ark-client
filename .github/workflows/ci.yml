name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to validate at its exact current head
        required: false
        type: string
      expected_head:
        description: Expected full PR head SHA (required by prepare-release)
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    name: PR Context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      base_sha: ${{ steps.context.outputs.base_sha }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      branch: ${{ steps.context.outputs.branch }}
      title: ${{ steps.context.outputs.title }}
      labels: ${{ steps.context.outputs.labels }}
      author: ${{ steps.context.outputs.author }}
      is_release: ${{ steps.context.outputs.is_release }}
      version: ${{ steps.context.outputs.version }}
      can_merge: ${{ steps.context.outputs.can_merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: 24.22.2
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/context.mjs

  validate:
    name: Validate
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SE_AVOID_BROWSER_DOWNLOAD: 'true'
      SE_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (node24)
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # UI/UE phase: existing unit tests remain deferred.
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm changelog:check

  changelog:
    name: Changelog Gate
    needs: context
    uses: ./.github/workflows/changelog.yml
    with:
      sha: ${{ needs.context.outputs.sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}
      branch: ${{ needs.context.outputs.branch }}
      labels: ${{ needs.context.outputs.labels }}
      author: ${{ needs.context.outputs.author }}

  candidate:
    name: Candidate Packages
    needs: [context, validate, changelog]
    if: needs.context.outputs.is_release == 'true'
    uses: ./.github/workflows/package.yml
    with:
      sha: ${{ needs.context.outputs.sha }}
      version: ${{ needs.context.outputs.version }}
      artifact_prefix: candidate-${{ needs.context.outputs.sha }}

  automerge:
    name: Auto Merge
    needs: [context, validate, changelog, candidate]
    if: >-
      always() && !cancelled() &&
      needs.context.outputs.can_merge == 'true' &&
      needs.validate.result == 'success' &&
      needs.changelog.result == 'success' &&
      (needs.candidate.result == 'success' ||
      (needs.context.outputs.is_release == 'false' && needs.candidate.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: read
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: 24.22.2
      - name: Merge only the validated head and dispatch follow-up workflows
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.context.outputs.sha }}
          EXPECTED_BASE: ${{ needs.context.outputs.base_sha }}
          IS_RELEASE: ${{ needs.context.outputs.is_release }}
          EXPECTED_LABELS: ${{ needs.context.outputs.labels }}
          EXPECTED_TITLE: ${{ needs.context.outputs.title }}
        run: node scripts/release/automerge.mjs
      - name: Delete only the unchanged merged source branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.context.outputs.sha }}
          EXPECTED_BRANCH: ${{ needs.context.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'A full validated head SHA is required.'
            exit 1
          fi
          git check-ref-format "refs/heads/$EXPECTED_BRANCH"
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          jq -e --arg repo "$GH_REPO" --arg head "$EXPECTED_HEAD" --arg branch "$EXPECTED_BRANCH" '
            .merged == true and .state == "closed" and .base.ref == "main" and
            .head.repo.full_name == $repo and .head.sha == $head and .head.ref == $branch
          ' <<< "$pr" > /dev/null
          default_branch=$(gh api "repos/$GH_REPO" --jq '.default_branch')
          if [[ "$EXPECTED_BRANCH" == "$default_branch" || "$EXPECTED_BRANCH" == main ]]; then
            echo 'Refusing to delete a default or main branch.'
            exit 1
          fi
          repo_git() {
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"
          }
          remote="$GITHUB_SERVER_URL/$GH_REPO.git"
          ref="refs/heads/$EXPECTED_BRANCH"
          existing=$(repo_git ls-remote --heads "$remote" "$ref")
          if [[ -z "$existing" ]]; then
            echo 'Merged source branch is already absent.'
            exit 0
          fi
          cleanup_dir=$(mktemp -d "$RUNNER_TEMP/flowark-branch-cleanup.XXXXXX")
          trap 'rm -rf "$cleanup_dir"' EXIT
          encoded_branch=$(jq -rn --arg branch "$EXPECTED_BRANCH" '$branch | @uri')
          if ! branch=$(gh api "repos/$GH_REPO/branches/$encoded_branch" 2> "$cleanup_dir/api-error"); then
            remaining=$(repo_git ls-remote --heads "$remote" "$ref")
            if [[ -z "$remaining" ]]; then
              echo 'Merged source branch was already removed.'
              exit 0
            fi
            cat "$cleanup_dir/api-error" >&2
            exit 1
          fi
          jq -e --arg head "$EXPECTED_HEAD" '
            .protected == false and .commit.sha == $head
          ' <<< "$branch" > /dev/null
          open_prs=$(gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100")
          jq -e --arg repo "$GH_REPO" --arg branch "$EXPECTED_BRANCH" '
            [ .[][] | select(.base.ref == $branch or
              (.head.repo.full_name == $repo and .head.ref == $branch)) ] | length == 0
          ' <<< "$open_prs" > /dev/null
          git init --bare --quiet "$cleanup_dir/repo.git"
          if ! repo_git -C "$cleanup_dir/repo.git" push --porcelain \
            "--force-with-lease=$ref:$EXPECTED_HEAD" "$remote" ":$ref"; then
            remaining=$(repo_git ls-remote --heads "$remote" "$ref")
            if [[ -n "$remaining" ]]; then
              echo 'Branch deletion refused; preserve the current remote ref.'
              exit 1
            fi
          fi
          remaining=$(repo_git ls-remote --heads "$remote" "$ref")
          if [[ -n "$remaining" ]]; then
            echo 'Source branch exists after cleanup; do not retry its deletion.'
            exit 1
          fi
          echo "Deleted merged source branch: $EXPECTED_BRANCH ($EXPECTED_HEAD)."
