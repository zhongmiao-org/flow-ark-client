name: Package

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: arm64, runner: macos-15 }
          - { platform: macos, arch: x64, runner: macos-15-intel }
          - { platform: windows, arch: x64, runner: windows-2022 }
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SE_AVOID_BROWSER_DOWNLOAD: 'true'
      SE_OFFLINE: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (node24)
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Check immutable source and version
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node -e 'if (JSON.parse(require("fs").readFileSync("package.json")).version !== process.env.VERSION) process.exit(1)'
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Electron runtime
        run: pnpm setup:electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
      - name: Prepare Linux packaging utilities
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Build and verify native packages
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: node scripts/package.mjs "$TARGET_PLATFORM" "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/packages/${{ matrix.platform }}-${{ matrix.arch }}/assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 0
          archive: true
