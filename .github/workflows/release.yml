name: Release
run-name: 'Release PR #${{ inputs.pr_number || github.event.pull_request.number }}'

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged release PR number to publish or recover
        required: true
        type: string
      artifact_run_id:
        description: Optional previous Release run with all four packages successful (recover upload only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release Metadata
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'build/release-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      published: ${{ steps.metadata.outputs.published }}
      artifact_run_id: ${{ steps.metadata.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: 24.22.2
      - id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node scripts/release/metadata.mjs

  packages:
    name: Release Packages
    needs: metadata
    if: needs.metadata.outputs.published == 'false' && needs.metadata.outputs.artifact_run_id == ''
    uses: ./.github/workflows/package.yml
    with:
      sha: ${{ needs.metadata.outputs.sha }}
      version: ${{ needs.metadata.outputs.version }}
      artifact_prefix: release-${{ needs.metadata.outputs.sha }}

  publish:
    name: Publish Release
    needs: [metadata, packages]
    if: >-
      always() && needs.metadata.result == 'success' && needs.metadata.outputs.published == 'false' &&
      (needs.packages.result == 'success' ||
      (needs.metadata.outputs.artifact_run_id != '' && needs.packages.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: 24.22.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (node24)
        with:
          pattern: release-${{ needs.metadata.outputs.sha }}-*
          path: release-source/.release/assets
          run-id: ${{ needs.metadata.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Verify all assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        working-directory: release-source
        run: node ../release-control/scripts/release/publish.mjs
